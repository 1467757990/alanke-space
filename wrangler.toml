# Cloudflare Workers static-assets deployment for this Astro site.
# The project was created as a Worker in the Cloudflare dashboard rather than
# a Pages project; this configuration lets `npx wrangler deploy` publish dist/.
name = "alanke-space"
compatibility_date = "2026-11-18"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
